# ========================================================
# JobNest H2 In-Memory Profile (Zero-Config College Demo)
# Activate via: mvn spring-boot:run -Dspring-boot.run.profiles=h2
# ========================================================

spring.application.name=JobNest

# ---- H2 In-Memory Database ----
spring.datasource.url=jdbc:h2:mem:jobnest_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=USER
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ---- H2 Web Console ----
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---- Server Port ----
server.port=${PORT:8080}

# ---- SQL Init Mode ----
spring.sql.init.mode=never
